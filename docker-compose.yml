version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: event_db
    restart: always
    environment:
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: event_platform_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - event-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_platform_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: event_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=event_user
      - DB_PASSWORD=secure_password
      - DB_NAME=event_platform_db
    depends_on:
      db:
        condition: service_healthy # <--- Теперь бэкенд будет ждать, пока БД полностью проснется
    networks:
      - event-net

  web:
    image: nginx:alpine
    container_name: event_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Конфиг для проксирования запросов к бэкенду
    depends_on:
      - backend
    networks:
      - event-net

volumes:
  pgdata:

networks:
  event-net:
    driver: bridge