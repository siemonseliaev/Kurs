name: CI/CD Pipeline

on:
  push:
    branches: [ main, stage4 ]
  pull_request:
    branches: [ main, stage4 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем исходный код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Docker Compose (если требуется для проверки сборки)
      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      # 3. Проверяем валидность и собираем контейнеры через docker-compose
      - name: Build Docker containers
        run: |
          docker compose build